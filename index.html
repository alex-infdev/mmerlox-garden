<style>
:root{
  --bg:#0b090e;
  --surface:#15111a;
  --line:#2b2331;
  --bone:#dcd2c4;
  --ash:#8f848c;
  --blood:#a3203a;
  --blood-dim:#33101a;
  --gold:#b8975e;
  --f-body:"IM Fell English",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{
  height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{position:relative;min-height:0;border:1px solid var(--line);background:var(--bg);overflow:hidden;cursor:crosshair;touch-action:none}
canvas{position:absolute;inset:0;display:block}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--bone);background:var(--surface);border:1px solid var(--line);padding:6px 12px;white-space:nowrap;pointer-events:none;z-index:4}

/* controls: garden and sky sets share one grid cell and cross-fade */
.controls{display:grid}
.ctl{grid-area:1/1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;transition:opacity .5s ease,transform .5s ease}
.ctl-garden{justify-content:space-between}
.ctl-sky{justify-content:center;align-self:start}
.ctl[inert]{opacity:0;transform:translateY(6px);pointer-events:none}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);margin-right:6px}
button{
  font-family:var(--f-body);font-size:15px;line-height:1;color:var(--bone);
  background:var(--surface);border:1px solid var(--line);border-radius:2px;
  padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
}
button:hover{border-color:var(--ash)}
button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:var(--blood-dim);border-color:var(--blood)}
.sw{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}

/* sky overlay: invisible hit targets on memory stars, the memory card, the way back down */
.mem{position:absolute;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:2}
.mem:hover{border:0}
.mem:focus-visible{outline:1px solid var(--gold);outline-offset:0}
/* the passcode box sits invisibly over the ASCII lock: tapping the lock opens the keypad, the canvas draws the slots */
.code{position:absolute;z-index:2;opacity:0;margin:0;padding:0;border:0;background:transparent;color:transparent;caret-color:transparent;font-size:16px;cursor:pointer}
.card{
  position:absolute;z-index:3;width:min(270px,calc(100% - 24px));
  background:var(--surface);border:1px solid var(--line);padding:12px 14px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.card-date{margin:0 0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-variant-numeric:tabular-nums}
.card-title{margin:0 0 6px;font-weight:400;font-size:19px;line-height:1.2;color:var(--bone);text-wrap:balance}
.card-note{margin:0;font-size:15px;line-height:1.45;color:var(--ash);white-space:pre-line}
.card{max-height:calc(100% - 16px);overflow:auto}
.card-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:10px}
.card-ask{font-size:14px;color:var(--ash);margin-right:auto}
button.link{background:transparent;border:0;padding:2px 0;font-size:13px;color:var(--ash);text-decoration:underline;text-underline-offset:3px}
button.link:hover{border:0;color:var(--bone)}
button.link.danger{color:#c4566c}
.whocard{width:auto;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.whocard .seg{justify-content:center;margin-top:8px}
.namecard{width:min(320px,calc(100% - 16px));left:50%;top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 16px);overflow:auto}
.namecard .seg{margin-top:10px}
.offers{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.offers:empty::before{content:"No names offered yet.";font-size:14px;color:var(--ash)}
.offer{font-size:15px;padding:5px 9px;border-left:3px solid var(--c)}
.offer small{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ash)}
.name-status{margin:8px 0 0;font-size:14px;line-height:1.4;color:var(--ash);min-height:1.4em}
.petname{width:10em;font-family:var(--f-body);font-size:16px;color:var(--bone);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:6px 8px}
.petname:focus-visible{outline:1px solid var(--gold);outline-offset:0}
.starform{width:min(300px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto}
.fld{display:grid;gap:4px;margin:0 0 10px}
.fld>span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.mem.group{border-radius:2px}
.nav{
  position:absolute;top:50%;z-index:2;transform:translateY(-50%);background:transparent;border:0;
  padding:14px 12px;font-family:var(--f-mono);font-size:20px;color:var(--ash);
}
.nav:hover{border:0;color:var(--bone)}
.nav.prev{left:4px}
.nav.next{right:4px}
.fld select{
  width:100%;font-family:var(--f-body);font-size:16px;color:var(--bone);
  background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:6px 8px;
}
.fld input,.fld textarea{
  width:100%;font-family:var(--f-body);font-size:16px;line-height:1.35;color:var(--bone);
  background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:6px 8px;resize:vertical;
}
.fld input:focus-visible,.fld textarea:focus-visible{outline:1px solid var(--gold);outline-offset:0}
.seg{display:flex;gap:6px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
button.primary{background:var(--blood-dim);border-color:var(--blood)}
button:disabled{opacity:.5;cursor:default}
.down{
  position:absolute;left:50%;bottom:10px;z-index:2;transform:translateX(-50%);
  background:transparent;border:0;padding:6px 14px;
  font-family:var(--f-mono);font-size:20px;color:var(--ash);
  transition:opacity .5s ease;
}
.down:hover{border:0;color:var(--bone)}
.down span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.down[inert]{opacity:0;pointer-events:none}
@keyframes bob{50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.down span{animation:none}.ctl{transition:opacity .2s}}
@media (max-width:560px){
  button{font-size:14px;padding:6px 9px}
}
</style>
</head>

      <label class="fld"><span>Date</span><input type="date" id="sfDate"></label>
      <label class="fld" id="sfTitleWrap"><span>Title</span><input type="text" id="sfTitle" maxlength="60"></label>

      <div class="fld"><span>From</span>
        <div class="seg" id="sfBy">

          <button type="button" data-by="teri" aria-pressed="false">Teri</button>

      </div>
      <div class="actions">
        <button type="button" id="sfCancel">Cancel</button>
        <button type="submit" id="sfSave" class="primary">Save star</button>
      </div>
    </form>
    <div class="card whocard" id="whoCard" role="dialog" aria-labelledby="whoTitle" hidden>
      <p class="card-date" id="whoTitle">Who's here?</p>
      <div class="seg">
        <button type="button" data-me="alex">Alex</button>
        <button type="button" data-me="teri">Teri</button>
      </div>
    </div>
    <button class="nav prev" id="navPrev" aria-label="Previous constellation" hidden><span>&lt;</span></button>
    <button class="nav next" id="navNext" aria-label="Next constellation" hidden><span>&gt;</span></button>
    <form class="card namecard" id="nameCard" autocomplete="off" hidden>
      <p class="card-date" id="nameTitle">Let's name her</p>
      <div class="offers" id="petOffers" role="listbox" aria-label="Names offered so far"></div>
      <p class="name-status" id="nameStatus"></p>
      <div class="seg">
        <input type="text" id="petName" maxlength="16" aria-label="A name to offer" placeholder="A name…" class="petname">
        <button type="submit">Offer name</button>
      </div>
      <div class="actions">
        <button type="button" class="link" id="nameClose">Not now</button>
        <button type="button" class="primary" id="nameDecide" disabled>Decided!</button>
      </div>
    </form>
    <button class="down" id="down" aria-label="Back to the garden" inert><span>v</span></button>
    <div class="toast" id="toast" hidden></div>
  </div>

  <footer class="controls">
    <div class="ctl ctl-garden" id="ctlGarden">
      <div class="group" id="chips" aria-label="Flower to plant">
        <span class="label">Plant</span>
        <button id="sp-random" data-sp="random" aria-pressed="true" title="Key 1"><span class="sw" style="--c:conic-gradient(#a3203a 0 25%,#6b46a0 0 50%,#ddd3c4 0 75%,#b45ab4 0)"></span>Any</button>
        <button id="sp-rose" data-sp="rose" aria-pressed="false" title="Key 2"><span class="sw" style="--c:#a3203a"></span>Rose</button>
        <button id="sp-nightshade" data-sp="nightshade" aria-pressed="false" title="Key 3"><span class="sw" style="--c:#6b46a0"></span>Nightshade</button>
        <button id="sp-lily" data-sp="lily" aria-pressed="false" title="Key 4"><span class="sw" style="--c:#ddd3c4"></span>Lily</button>
        <button id="sp-thistle" data-sp="thistle" aria-pressed="false" title="Key 5"><span class="sw" style="--c:#b45ab4"></span>Thistle</button>
      </div>
      <div class="group">
        <button class="sendStar" hidden>Send a shooting star</button>
        <button id="gust" title="Space">Gust</button>
        <button id="scatter" title="Key S">Scatter all</button>
        <button id="auto" aria-pressed="false" title="Key A">Self-seeding</button>
        <button id="copy" title="Key C">Copy frame</button>
      </div>
    </div>
    <div class="ctl ctl-sky" id="ctlSky" inert>
      <button class="sendStar" hidden>Send a shooting star</button>
      <button id="readBtn" aria-pressed="false" hidden>Read slowly</button>
      <button id="addStar" aria-pressed="false" hidden>Add a star</button>
      <button id="backupBtn" hidden>Back up</button>
    </div>
    <div class="ctl ctl-sky" id="ctlPond" inert>
      <button id="petFeed" hidden>Feed</button>
      <button id="petPlay" hidden>Play</button>
      <button id="petNameBtn" hidden>Name her</button>
      <button id="pondBack">Back to the garden</button>
    </div>
  </footer>
</div>

    if (band < .2) continue;
    const v = band * vnoise(wc * .14, sr * .3);
    // speckled rather than filled, so the band reads as dust, not a block of dots
    if (v > .38 && hash(wc + 501, sr + 77) < v * .45) {
      const tw = .75 + .25 * Math.sin(T * .8 + wc * .7 + sr);
      putE(c, sr - rows, v > .6 && hash(wc, sr + 9) < .3 ? ':' : '.', rgbs(mixc(BG, FOG, (.1 + .32 * v) * tw)));
    }
  }
  const asp = cw / chH;
  if (lock.state === 'open') drawConstellations(asp);
  if (lock.state === 'locked' || lock.state === 'checking' || lock.state === 'opening') drawLock();
  if (lock.state === 'dust') drawDust();
}

/* ---------- deep sky ----------
   Faint nebulae and distant bodies behind everything, barely there. They only fill empty cells, so
   every star stays in front, and they drift at a third of the constellations' speed. Positions are
   in screen widths across (x) and fractions of the sky's height (y). */
const NEBULAE = [
  { x: .18, y: .30, rx: .20, ry: .28, col: [118, 64, 150], seed: 3 },   // violet
  { x: .64, y: .70, rx: .24, ry: .18, col: [132, 38, 58], seed: 11 },   // wine
  { x: 1.05, y: .26, rx: .18, ry: .22, col: [58, 86, 132], seed: 19 },  // cold blue
  { x: 1.50, y: .62, rx: .22, ry: .24, col: [104, 52, 128], seed: 27 }, // violet
];
const deepC = (x, deepPan) => x * cols - deepPan;

function drawDeepSky(deepPan) {
  const asp = cw / chH;
  // nebulae: soft clouds of dust, thickest at the middle, broken up by noise
  for (const n of NEBULAE) {
    const cx = deepC(n.x, deepPan), hw = n.rx * cols, cy = n.y * rows, hh = n.ry * rows;
    if (cx + hw < 0 || cx - hw > cols) continue;
    for (let sr = Math.max(0, Math.floor(cy - hh)); sr <= Math.min(rows - 1, cy + hh); sr++) {
      for (let c = Math.max(0, Math.floor(cx - hw)); c <= Math.min(cols - 1, cx + hw); c++) {
        const dx = (c - cx) / hw, dy = (sr - cy) / hh, d2 = dx * dx + dy * dy;
        if (d2 > 1) continue;
        const wc = Math.floor(c + deepPan);   // sample by sky position so the cloud keeps its shape while panning
        const f = vnoise(wc * .08 + n.seed, sr * .18) * .65 + vnoise(wc * .21 + n.seed * 3, sr * .45) * .35;
        const v = Math.pow(1 - d2, 1.4) * f;
        if (v < .2 || hash(wc + n.seed * 101, sr + 7) > v * 1.1) continue;
        putE(c, sr - rows, v > .5 ? ':' : v > .34 ? "'" : '.', rgbs(mixc(BG, n.col, .05 + .15 * v)));
      }
    }
  }
  // a ringed planet, lit from the upper left; its ring is an ellipse that passes behind the planet
  // along the top and in front of it along the bottom
  {
    const pc = deepC(.8, deepPan), pr = rows * .2, R = clamp(rows * .07, 2.4, 4.2);
    const tint = [168, 120, 84], ramp = '.:-=+*', Rr = R * 1.9, flat = .26;
    for (let dy = -Math.ceil(R); dy <= Math.ceil(R); dy++) for (let dx = -Math.ceil(R / asp); dx <= Math.ceil(R / asp); dx++) {
      const px = dx * asp / R, py = dy / R, d2 = px * px + py * py;
      if (d2 > 1) continue;
      const lum = clamp01(-.55 * px - .45 * py + .7 * Math.sqrt(1 - d2));
      put(pc + dx, pr + dy - rows, ramp[Math.min(ramp.length - 1, (lum * ramp.length) | 0)], rgbs(mixc(BG, tint, .06 + .14 * lum)));
    }
    for (let k = 0; k < 120; k++) {
      const t = k / 120 * Math.PI * 2, x = Math.cos(t) * Rr, y = Math.sin(t) * Rr * flat;
      const front = Math.sin(t) > 0, overPlanet = (x / R) ** 2 + (y / R) ** 2 < 1;
      if (!front && overPlanet) continue;   // that stretch of ring is hidden behind the planet
      put(pc + x / asp, pr + y - rows, Math.abs(Math.cos(t)) > .93 ? '.' : '-', rgbs(mixc(BG, tint, front ? .13 : .09)));
    }
  }
  // a spiral galaxy, tilted away
  {
    const gc = deepC(.22, deepPan), gr = rows * .74, rot = RM ? 0 : T * .01;
    for (let arm = 0; arm < 2; arm++) for (let k = 0; k < 64; k++) {
      const t = k / 64 * Math.PI * 2.4, r = .6 + t * .95, a = t + arm * Math.PI + rot;
      putE(gc + Math.cos(a) * r / asp * .9, gr + Math.sin(a) * r * .38 - rows, k % 3 ? '.' : "'", rgbs(mixc(BG, [150, 140, 190], .05 + .1 * (1 - k / 64))));
    }
    put(gc, gr - rows, '*', rgbs(mixc(BG, [200, 190, 220], .2)));
  }
  // a small far planet, cold and pale
  {
    const pc = deepC(1.22, deepPan), pr = rows * .46, R = clamp(rows * .025, 1, 1.8);
    for (let dy = -Math.ceil(R); dy <= Math.ceil(R); dy++) for (let dx = -Math.ceil(R / asp); dx <= Math.ceil(R / asp); dx++) {
      const px = dx * asp / R, py = dy / R;
      if (px * px + py * py > 1) continue;
      putE(pc + dx, pr + dy - rows, px < -.2 ? ':' : '.', rgbs(mixc(BG, [96, 128, 140], .1 + (px < -.2 ? .05 : 0))));
    }
  }
  // a comet hanging high up, its tail streaming back
  {
    const cc = deepC(.46, deepPan), cr = rows * .12;
    put(cc, cr - rows, '*', rgbs(mixc(BG, [210, 220, 230], .22)));
    for (let k = 1; k <= 9; k++)
      putE(cc - k, cr + Math.round(k * .18) - rows, k < 3 ? '=' : k < 6 ? '-' : '.', rgbs(mixc(BG, [170, 190, 210], .16 * (1 - k / 11))));
  }
}

function drawConstellations(asp) {
  const ze = zoom.id ? easeInOut(zoom.p) : 0;
  for (const g of groups) {
    const vis = groupVisibility(g);
    if (vis < .04) continue;
    const pos = starPositions(g), focused = g.id === zoom.id;
    const big = focused ? ze : 0;   // stars grow arms as their constellation comes close
    // lines: each one draws from the earlier star to the later as reveal grows
    for (let i = 1; i < pos.length; i++) {
      const p = clamp01(g.reveal - (i - 1));
      if (p <= 0) break;
      const a = pos[i - 1], b = pos[i], dc = b.c - a.c, dr = b.sr - a.sr;
      const steps = Math.ceil(Math.hypot(dc * asp, dr) / 1.1);
      for (let k = 1; k < steps; k++) {
        const u = k / steps;
        if (u > p) break;
        if (u * steps < 1.4 || (1 - u) * steps < 1.4) continue;
        // the line out to a star still to come is fainter
        putE(a.c + dc * u, a.sr + dr * u - rows, '.', rgbs(mixc(BG, MEM, (isFuture(g.stars[i]) ? .13 : .3) * vis)));
      }
    }
    g.stars.forEach((m, i) => {
      const { c, sr } = pos[i], r = sr - rows;
      const lit = m === openStar || m.hover, tint = m.by === 'teri' ? TERI : MEM;
      const pulse = .7 + .3 * Math.sin(T * 1.4 + i * 1.7 + g.stars.length);
      if (isFuture(m) && !lit) {
        // still to come: a faint point until its day arrives
        put(c, r, '+', rgbs(mixc(BG, tint, (.2 + .08 * pulse) * vis)));
        return;
      }
      const anniv = isAnniversary(m), gold = lit || anniv;
      const col = gold ? mixc(BG, GOLD, vis) : mixc(BG, tint, (.55 + .45 * pulse) * vis);
      if (big > .5 || anniv) {
        const arm = rgbs(mixc(BG, gold ? GOLD : tint, (gold ? .75 : .35 + .25 * pulse) * vis));
        put(c - 1, r, '-', arm); put(c + 1, r, '-', arm);
        put(c, r - 1, '.', arm); put(c, r + 1, "'", arm);
      }
      if (anniv) {
        // its day: a slow breathing halo
        const hr = 2.2 + (RM ? 0 : Math.sin(T * 1.6) * .6);
        for (let k = 0; k < 12; k++) {
          const a = k / 12 * 6.283 + T * (RM ? 0 : .2);
          putE(c + Math.cos(a) * hr / asp * .55, r + Math.sin(a) * hr * .55, '.', rgbs(mixc(BG, GOLD, .45 * vis)));
        }
      }
      put(c, r, '*', rgbs(col));
      sparkle(c, r, T - (m.born ?? -99), tint, asp);
      sparkle(c, r, T - (m.flare ?? -99), GOLD, asp);   // struck by a shooting star
    });
    // the name: under the constellation in the overview, across the top when zoomed in
    const label = spaced(g.name);
    if (!focused || ze < 1) {
      // a constellation holding a star on its day shows its name in gold
      const b = overviewBox(g), hot = g.hover || g.stars.some(isAnniversary);
      const a = (1 - (focused ? ze : 0)) * vis * (hot ? .85 : .45);
      // just under the constellation's lowest star
      const r0 = Math.max(...pos.map(p => p.sr)) + 3;
      if (a > .03) for (let i = 0; i < label.length; i++) put(b.c - label.length / 2 + i, r0 - rows, label[i], rgbs(mixc(BG, hot ? GOLD : MEM, a)));
    }
    if (focused && ze > 0) {
      const r0 = Math.max(1, rows * .07);
      for (let i = 0; i < label.length; i++) put(cols / 2 - label.length / 2 + i, r0 - rows, label[i], rgbs(mixc(BG, MEM, .6 * ze)));
    }
  }
}

function sparkle(c, r, age, col, asp) {
  if (age < 0 || age > 1.4) return;
  const rr = age * 5, fade = 1 - age / 1.4;
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * 6.283;
    putE(c + Math.cos(a) * rr / asp * .5, r + Math.sin(a) * rr * .5, '.', rgbs(mixc(BG, col, fade)));
  }
}

/* ---------- the lock ----------
   Rows 0-4 are the shackle, the rest the body; the passcode slots go on SLOT_ROW. */
const LOCK = [
  "     .-'''''-.     ",
  "    / .-----. \\    ",
  "   / /       \\ \\   ",
  "   | |       | |   ",
  "   | |       | |   ",
  ".--'-'-------'-'--.",
  "|                 |",
  "|      .---.      |",
  "|      | o |      |",
  "|      '-v-'      |",
  "|                 |",
  "|                 |",
  "'-----------------'",
];
const SHACKLE_ROWS = 5, SLOT_ROW = 11, LOCK_W = LOCK[0].length;
const lock = { state: SEALED ? 'locked' : 'open', code: '', shake: 0, t: 0, dust: [] };
const lockOrigin = () => ({ c0: Math.round(cols / 2 - LOCK_W / 2), sr0: Math.round(rows * .44 - LOCK.length / 2) });

function drawLock() {
  const { c0, sr0 } = lockOrigin();
  const sx = lock.shake > 0 ? Math.round(Math.sin(T * 55) * 1.6 * Math.min(1, lock.shake * 2.5)) : 0;
  const lift = lock.state === 'opening' ? Math.round(ease(clamp01(lock.t / .6)) * 2) : 0;
  const bodyC = rgbs(mixc(BG, MEM, .5)), shackleC = rgbs(mixc(BG, STAR, .75)), holeC = rgbs(mixc(BG, GOLD, .8));
  LOCK.forEach((ln, r) => {
    const sh = r < SHACKLE_ROWS, rr = sr0 + r - (sh ? lift : 0) - rows;
    const a = ln.search(/\S/), b = ln.trimEnd().length;
    for (let i = a; i < b; i++) {
      if (sh && ln[i] === ' ') continue;   // stars still show through the shackle's loop
      put(c0 + i + sx, rr, ln[i], sh ? shackleC : (r > 6 && r < 10 && /[ov]/.test(ln[i]) ? holeC : bodyC));
    }
  });
  // as the shackle rises, its left leg stays in the lock and the right one comes free
  for (let k = 0; k < lift; k++) {
    put(c0 + 3 + sx, sr0 + SHACKLE_ROWS - 1 - k - rows, '|', shackleC);
    put(c0 + 5 + sx, sr0 + SHACKLE_ROWS - 1 - k - rows, '|', shackleC);
  }
  const focused = document.activeElement === codeInput;
  for (let k = 0; k < 6; k++) {
    const filled = k < lock.code.length, cursor = focused && k === lock.code.length && lock.state === 'locked';
    const col = lock.shake > 0 ? [190, 52, 72] : filled ? GOLD : cursor && Math.sin(T * 6) > 0 ? MEM : mixc(BG, MEM, .35);
    const ch = filled ? (lock.state === 'checking' && Math.sin(T * 9 + k) > 0 ? '+' : '*') : '_';
    put(c0 + 4 + k * 2 + sx, sr0 + SLOT_ROW - rows, ch, rgbs(col));
  }
}

function drawDust() {
  for (const p of lock.dust) {
    const k = easeInOut(clamp01((lock.t - .6 - p.d) / 1.3));
    const swirl = Math.sin(k * Math.PI) * p.sw;
    const x = p.x + (p.tx - p.x) * k + swirl, y = p.y + (p.ty - p.y) * k - swirl * .3;
    const ch = k < .15 ? p.ch : k < .9 ? (p.d > .3 ? "'" : '.') : '*';
    put(x, y - rows, ch, rgbs(mixc(BG, k < .5 ? MEM : GOLD, .4 + .5 * k)));
  }
}

function crumbleLock() {
  const { c0, sr0 } = lockOrigin();
  lock.dust = [];
  LOCK.forEach((ln, r) => {
    for (let i = 0; i < ln.length; i++) {
      if (ln[i] === ' ' || hash(i, r) > .7) continue;
      // every grain of the lock drifts to one of the stars in the overview
      const g = groups[(hash(i + 3, r + 5) * groups.length) | 0];
      if (!g) continue;
      const pos = starPositions(g), { c, sr } = pos[(hash(i + 7, r) * pos.length) | 0];
      lock.dust.push({ x: c0 + i, y: sr0 + r - (r < SHACKLE_ROWS ? 2 : 0), tx: c, ty: sr, ch: ln[i],
        d: hash(i + 9, r) * .5, sw: (hash(i, r + 11) - .5) * 8 });
    }
  });
  lock.state = 'dust';
}

/* ---------- days together ----------
   Counted from 21 June 2026 by the viewer's own calendar. Every hundredth day and every full year
   the stone glows on its own and shows the count without being asked. */
function daysTogether() {
  const n = new Date();
  return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(2026, 5, 21)) / 864e5);
}
const isRoundDay = d => d > 0 && (d % 100 === 0 || d % 365 === 0);
let daysAlpha = 0, stoneHold = null, stonePress = null;

/* ---------- seasons ----------
   By the real month, a very sparse fall across the garden: snow in winter, leaves in autumn,
   petals in spring; summer leaves the air to the fireflies. Each flake fades out on the ground. */
const SEASONS = {
  winter: { chars: ".*'", cols: [[214, 220, 232]], density: .1, fall: [.6, 1.2], sway: .5, alpha: .3 },
  autumn: { chars: ",`'", cols: [[150, 78, 40], [168, 112, 52], [120, 58, 44]], density: .035, fall: [1.4, 2.4], sway: 1.6, alpha: .42 },
  spring: { chars: "'.`", cols: [[222, 170, 192], [236, 214, 222]], density: .04, fall: [.9, 1.6], sway: 1.1, alpha: .36 },
};
function seasonNow() {
  const m = new Date().getMonth();
  return m === 11 || m < 2 ? 'winter' : m < 5 ? 'spring' : m < 8 ? null : 'autumn';
}
let seasonals = [];
function updateSeason(dt) {
  const S = SEASONS[seasonNow()];
  if (!S) { seasonals = []; return; }
  const want = Math.round(cols * S.density * (RM ? .5 : 1)), slow = RM ? .6 : 1;
  if (seasonals.length < want && Math.random() < dt * want * .25)
    seasonals.push({ x: rand(-4, cols + 4), y: -1, vy: rand(...S.fall) * slow, ph: Math.random() * 6.28,
      ch: S.chars[(Math.random() * S.chars.length) | 0], col: S.cols[(Math.random() * S.cols.length) | 0], rest: 0 });
  for (const s of seasonals) {
    if (s.y < ground) {
      s.y += s.vy * dt;
      s.x += (wind * .9 + Math.sin(t * .9 + s.ph) * S.sway) * dt * slow;
      if (s.y >= ground) s.y = ground - .01;
    } else s.rest += dt;
  }
  seasonals = seasonals.filter(s => s.rest < 4 && s.x > -6 && s.x < cols + 6);
}
function drawSeason() {
  const S = SEASONS[seasonNow()];
  if (!S) return;
  for (const s of seasonals) {
    const fade = 1 - s.rest / 4;
    putE(s.x, s.y, s.rest > 0 ? '.' : s.ch, rgbs(mixc(BG, s.col, S.alpha * fade)));
  }
}

/* ---------- update ---------- */
function updateGarden(dt) {
  const breeze = (RM ? .3 : 1) * (Math.sin(t * .13) * .6 + Math.sin(t * .37 + 1) * .3);
  gust *= Math.exp(-dt * 1.1);
  wind += (breeze + gust - wind) * Math.min(1, dt * 2);
  fogX += (.35 + wind * .25) * dt * (RM ? .2 : 1);

  const pcx = (pointer.x - ox) / cw, pcy = (pointer.y - oy) / chH;
  for (const f of flowers) {
    f.age += dt;
    let target = 0;
    if (pointer.in) {
      const topX = f.cx || f.xf * cols, topY = f.cy || ground - f.hf * ground;
      const dx = pcx - topX, d = Math.hypot(dx * .55, (pcy - topY) * .4);
      if (d < 9) target = -Math.sign(dx || 1) * (1 - d / 9) * 3.5;
    }
    f.push += (target - f.push) * Math.min(1, dt * 4);
    const P = f.P;
    if (P && P.w > 0 && P.w < 1 && f.R > 1) {
      f.shed += dt * 7;
      while (f.shed > 1) { burst(f, 1); f.shed--; }
    }
  }
  flowers = flowers.filter(f => f.age < f.life + f.witherT + 2.5);

  for (const p of petals) {
    if (p.y < ground) {
      p.vy = Math.min(4, p.vy + 3.5 * dt);
      p.vx += (wind * 3 - p.vx) * dt * .8 + Math.sin(t * 3 + p.ph) * dt * 2;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y >= ground) { p.y = ground - .01; p.ch = '.'; }
    } else p.life -= dt;
    p.life -= dt * .5;
  }
  petals = petals.filter(p => p.life > 0 && p.x > -2 && p.x < cols + 2);
  updateSeason(dt);
  if (petals.length > 900) petals.splice(0, petals.length - 900);

  for (const fl of flies) {
    fl.vx += (vnoise(fl.ph * 10 + t * .3, 1) - .5) * dt * 7;
    fl.vy += (vnoise(fl.ph * 10 + t * .3, 9) - .5) * dt * 5;
    if (pointer.in) {
      const dx = pcx - fl.x, dy = pcy - fl.y, d = Math.hypot(dx, dy) + 1;
      if (d < 22) { fl.vx += dx / d * dt * 4; fl.vy += dy / d * dt * 3; }
    }
    fl.vx *= 1 - dt * .8; fl.vy *= 1 - dt * .8;
    fl.x += fl.vx * dt; fl.y += fl.vy * dt;
    if (fl.x < 1 || fl.x > cols - 2) { fl.vx *= -1; fl.x = clamp(fl.x, 1, cols - 2); }
    if (fl.y < rows * .25 || fl.y > ground - 2) { fl.vy *= -1; fl.y = clamp(fl.y, rows * .25, ground - 2); }
  }

  if (!RM && cols > 40) {
    nextBat -= dt;
    if (nextBat <= 0) {
      const d = Math.random() < .5 ? 1 : -1;
      bats.push({ x: d > 0 ? -4 : cols + 4, y: rand(rows * .08, rows * .32), vx: d * rand(7, 12), ph: Math.random() * 6.28 });
      nextBat = rand(7, 16);
    }
  }
  for (const b of bats) { b.x += b.vx * dt; b.y += Math.sin(t * 3 + b.ph) * dt * 1.5; }
  bats = bats.filter(b => b.x > -6 && b.x < cols + 6);

  if (auto) {
    nextAuto -= dt;
    if (nextAuto <= 0) {
      if (living().length < maxFlowers()) plant(openSpot(), 'random', { depth: rand(.55, 1) });
      nextAuto = rand(2.5, 5);
    }
  }

  // the stone glows faintly every so often, and brightens under the cursor
  const cycle = (t % 9) / 9;
  const pulse = cycle > .7 ? Math.sin((cycle - .7) / .3 * Math.PI) : 0;
  const special = isRoundDay(daysTogether());
  stoneGlow += ((stoneHover ? 1 : special ? .7 + pulse * .3 : pulse * .75) - stoneGlow) * Math.min(1, dt * 4);
  const showDays = stoneHover || special || (stoneHold != null && T - stoneHold < 3);
  daysAlpha += ((showDays ? .7 : 0) - daysAlpha) * Math.min(1, dt * 2.5);
  updateMusicBox(dt); updateVisitor(dt); updateGardenPond(dt);
}

function updateSky(dt) {
  nextMeteor -= dt;
  if (nextMeteor <= 0) {
    const d = Math.random() < .5 ? 1 : -1;
    // world rows: the garden's upper sky when looking at the garden, the sky screen when up there
    const top = view === 'sky' ? -rows : 0;
    meteors.push({ x: rand(cols * .1, cols * .9), y: top + rand(1, rows * (view === 'sky' ? .6 : .22)),
      vx: d * rand(30, 48), vy: rand(5, 10), age: 0, life: rand(.7, 1.1) });
    nextMeteor = RM ? rand(25, 50) : rand(6, 18);
  }
  // on a star's day, every so often a shooting star runs straight into it
  // (with reduced motion it still comes, just less often, like the other shooting stars)
  if (view === 'sky' && camP === 1 && lock.state === 'open') {
    nextAimed -= dt;
    if (nextAimed <= 0) {
      nextAimed = RM ? rand(40, 60) : rand(14, 24);
      const targets = [];
      for (const g of groups) {
        if (groupVisibility(g) < .9) continue;
        const pos = starPositions(g);
        g.stars.forEach((m, i) => { if (isAnniversary(m) && pos[i].c > 2 && pos[i].c < cols - 2) targets.push({ m, ...pos[i] }); });
      }
      if (targets.length) {
        const tg = targets[(Math.random() * targets.length) | 0], d = Math.random() < .5 ? 1 : -1;
        const vx = d * rand(30, 40), vy = rand(5, 8), life = .9;
        meteors.push({ x: tg.c - vx * life, y: tg.sr - rows - vy * life, vx, vy, age: 0, life, target: tg.m });
      }
    }
  }
  for (const m of meteors) {
    m.age += dt; m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.target && !m.hit && m.age >= m.life) { m.hit = true; m.target.flare = T; }
    if (m.label && !m.end && m.age >= m.life * .7) m.end = { x: m.x, y: m.y };   // where its "from …" stays
  }
  meteors = meteors.filter(m => m.age < m.life + (m.label ? 3.4 : .4));

  if (camP < 1) {
    camP = Math.min(1, camP + dt / CAM_DUR);
    cam = camFrom + (camTo - camFrom) * easeInOut(camP);
    if (camP === 1) onArrive();
  }
  if (lock.shake > 0) {
    lock.shake = Math.max(0, lock.shake - dt);
    if (lock.shake === 0) { lock.code = ''; codeInput.value = ''; }
  }
  if (lock.state === 'opening' || lock.state === 'dust') {
    lock.t += dt;

/* the hour, in the colour of the sky: a whisper of tint low on the horizon that follows the viewer's

const SKY_HOURS = [
  [0, [44, 32, 78], .05],    // midnight: almost nothing
  [4.5, [70, 92, 124], .10], // before dawn: grey-blue
  [7, [118, 86, 104], .10],  // first light: ash rose
  [12, [52, 64, 96], .06],   // midday: still night here, only a little paler
  [18, [124, 62, 112], .13], // dusk: violet and rose
  [21, [64, 38, 96], .08],   // late evening
  [24, [44, 32, 78], .05],

  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;

  while (i < SKY_HOURS.length - 2 && SKY_HOURS[i + 1][0] <= h) i++;
  const [h0, c0, a0] = SKY_HOURS[i], [h1, c1, a1] = SKY_HOURS[i + 1], k = easeInOut(clamp01((h - h0) / (h1 - h0)));

/* ---------- unlocking ---------- */
const KEY_STORE = 'nightshade-unlock';

  if (!window.crypto?.subtle) {

    return;
  }

    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(

    unlockRaw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt: SEALED.salt, k: tob64(unlockRaw) })); } catch (e) {}
    unlockKey = key; useSealed(sealed);
    loadStars();
    codeInput.blur();
    if (RM) { lock.state = 'open'; resetReveal(); } else { lock.state = 'opening'; lock.t = 0; }
  } catch (e) {
    lock.state = 'locked'; lock.shake = .6;
  }
}
async function restoreUnlock() {
  if (!SEALED) return;
  try {
    const saved = JSON.parse(localStorage.getItem(KEY_STORE) || 'null');
    if (!saved || saved.salt !== SEALED.salt) return;
    const key = await crypto.subtle.importKey('raw', unb64(saved.k), 'AES-GCM', false, ['encrypt', 'decrypt']);
    useSealed(await openSeal(key));

/* ---------- stars and constellations added from the sky ----------
   Each row is encrypted with the unlock key before it leaves the browser: either a star
   ({kind:'star', group, sort, title, note, by}) or a new constellation ({kind:'theme', id, name}).
   Rows that don't open with this key (junk, or written under another passcode) are skipped.
   Every row also carries a random nonce and the hash of an edit token derived from the key and that
   nonce, so only someone with the code can edit or delete it (supabase/stars-edit.sql checks the hash).

/* ---------- who's here ----------

// a pet row arriving (from this device, the other one, or the saved copy)

  const mine = petRows.find(p => p.ct === row.ct);
  if (mine) { if (row.id != null) mine.id = row.id; return; }
  if (row.id != null && petRows.some(p => p.id === row.id)) return;
  petRows.push({ id: row.id ?? null, nonce: row.nonce || null, ct: row.ct, d });
}
async function recordPet(action, extra = {}) {
  if (!unlockKey) return null;
  const careful = ['feed', 'pet', 'play'].includes(action);
  // a cuddle every few seconds doesn't need saving every time; once in a while is enough
  if (careful && Date.now() - (petRecorded[action] || 0) < 10 * 6e4) return null;
  petRecorded[action] = Date.now();
  const d = { action, by: me || author, at: Date.now(), ...extra };
  const row = await sealRow({ kind: 'pet', ...d });
  petRows.push({ id: null, nonce: row.nonce, ct: row.ct, d });
  await queueRow(row);
  // keep only the newest of each kind: the latest feed/pet/play/name, and each person's latest pick
  if (careful || action === 'name') await prunePet(p => p.d.action === action && p.ct !== row.ct);
  if (action === 'decide') await prunePet(p => p.d.action === 'decide' && p.d.by === d.by && p.ct !== row.ct);
  return d;
}
async function prunePet(which) {
  if (!db) return;
  for (const old of petRows.filter(p => which(p) && p.id != null && p.nonce)) {
    try {
      const { data } = await db.rpc('delete_star', { p_id: old.id, p_token: await editToken(old.nonce) });
      if (data) petRows = petRows.filter(p => p !== old);
    } catch (e) {}
  }
}

/* naming her, together: either of you offers names, and a name is hers only once you've both
   picked the same one. A rename starts a fresh round; the round is everything since her last name. */
const otherOf = who => who === 'teri' ? 'alex' : 'teri';
function namingRound() {
  const since = petLatest('name')?.at || 0;
  const inRound = a => petRows.filter(p => p.d.action === a && p.d.at > since).map(p => p.d).sort((x, y) => x.at - y.at);
  const offers = [], seen = new Set();
  for (const o of inRound('offer')) { const k = o.name.toLowerCase(); if (!seen.has(k)) { seen.add(k); offers.push(o); } }
  const picks = {};
  for (const dcd of inRound('decide')) picks[dcd.by] = dcd.name;
  return { offers, picks };
}
let pickedName = null, nameOpen = false, nameDismissed = false, nameSig = '';
async function offerName(name) {
  if (!name || namingRound().offers.some(o => o.name.toLowerCase() === name.toLowerCase())) { pickedName = name || pickedName; return; }
  pickedName = name;
  await recordPet('offer', { name });
}
async function decideName() {
  if (!pickedName) return;
  const mine = me || author;
  const d = await recordPet('decide', { name: pickedName });
  if (!d) return;
  // if the other one already picked this same name, she's named
  const { picks } = namingRound();
  if (picks[otherOf(mine)] && picks[otherOf(mine)].toLowerCase() === pickedName.toLowerCase()) {
    const since = petLatest('name')?.at || 0;
    await recordPet('name', { name: pickedName });
    await prunePet(p => (p.d.action === 'offer' || p.d.action === 'decide') && p.d.at > since);
    nameOpen = false; pickedName = null;
    hearts.push({ x: ax.x, y: ax.y - 2, born: pond.t }); ax.happy = 4; chime(84);
    toast(`She's called ${petName()} now`);
  }
}
function renderNameCard() {
  const { offers, picks } = namingRound(), mine = me || author, other = otherOf(mine);
  const sig = JSON.stringify([offers.map(o => o.name + o.by), picks, pickedName, petName()]);
  if (sig === nameSig) return;
  nameSig = sig;
  document.getElementById('nameTitle').textContent = petName() ? `A new name for ${petName()}?` : "Let's name her";
  const list = document.getElementById('petOffers');
  list.replaceChildren(...offers.map(o => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'offer'; b.setAttribute('role', 'option');
    b.style.setProperty('--c', o.by === 'teri' ? 'rgb(236,152,174)' : 'rgb(212,172,96)');
    b.setAttribute('aria-pressed', String(pickedName === o.name));
    const who = Object.entries(picks).filter(([, n]) => n.toLowerCase() === o.name.toLowerCase()).map(([w]) => NAMES[w]);
    b.append(o.name);
    if (who.length) { const s = document.createElement('small'); s.textContent = ' picked by ' + who.join(' & '); b.append(s); }
    b.addEventListener('click', () => { pickedName = o.name; nameSig = ''; renderNameCard(); });
    return b;
  }));
  const status = document.getElementById('nameStatus');
  const myPick = picks[mine], theirPick = picks[other];
  status.textContent = myPick && theirPick ? `You picked ${myPick}; ${NAMES[other]} picked ${theirPick}. Pick the same one to decide.`
    : myPick ? `You picked ${myPick}. Waiting for ${NAMES[other]}.`
    : theirPick ? `${NAMES[other]} picked ${theirPick}. Pick it too to make it hers.`
    : offers.length ? 'Tap a name, then Decided! when it feels right.' : `Offer a name, then wait for ${NAMES[other]}'s ideas too.`;
  document.getElementById('nameDecide').disabled = !pickedName || myPick === pickedName;
}

/* in the garden: three rows of water set into the ground, a lily pad, the moon's glint */
function drawGardenPond() {
  const w = clamp(Math.round(cols * .2), 12, 20), c0 = Math.max(1, Math.round(cols * .05)), top = ground - 1;
  pondRect = { c0, c1: c0 + w, r0: top - 2, r1: top + 2 };
  const lift = pondHover ? .18 : 0;
  // sits on the ground line, so it reads clearly above the darker edge of the screen
  for (let r = 0; r < 3; r++) {
    const inset = r === 1 ? 0 : 1, row = top + r;
    for (let c = c0 + inset; c < c0 + w - inset; c++) {
      const edgeL = c === c0 + inset, edgeR = c === c0 + w - inset - 1;
      let ch, col;
      if (edgeL || edgeR) { ch = r === 0 ? '.' : r === 1 ? (edgeL ? '(' : ')') : "'"; col = mixc(BG, [120, 126, 108], .6 + lift); }
      else {
        const v = vnoise(c * .45 + t * .5, r * 3);
        ch = r === 0 ? '_' : v > .55 ? '~' : '-'; col = mixc(BG, WATER, .42 + .25 * v + lift);
      }
      put(c, row, ch, rgbs(col));
    }
  }
  put(c0 + 3, top + 1, 'o', rgbs(mixc(BG, [86, 132, 82], .85)));   // a lily pad
  if (Math.sin(t * 1.3) > -.2) put(c0 + Math.round(w * .65), top + 1, '*', rgbs(mixc(BG, MOON, .5)));   // the moon in the water
  // two reeds at the far edge
  for (const [dc, h] of [[w - 2, 3], [w - 1, 2]]) for (let k = 1; k <= h; k++)
    put(c0 + dc + (k === h ? Math.round(Math.sin(t + dc) * .4) : 0), top - k + 1, k === h ? ')' : '|', rgbs(mixc(BG, REED, .65)));
  // now and then, if she lives here on this device, a little pink face peeks up
  if (unlockKey && pond.peek > 0) put(c0 + Math.round(w * .4), top + 1, '^', rgbs(mixc(BG, PET_BODY, Math.min(1, pond.peek) * .95)));
}
function overPond(p) {
  if (!pondRect || cam !== 0) return false;
  const c = (p.x - ox) / cw, r = (p.y - oy) / chH;
  return c >= pondRect.c0 && c < pondRect.c1 && r >= pondRect.r0 && r < pondRect.r1 + 1;
}
function updateGardenPond(dt) {
  pond.peekAt -= dt;
  if (pond.peekAt <= 0) { pond.peek = 2.2; pond.peekAt = rand(18, 34); }
  pond.peek = Math.max(0, pond.peek - dt);
}

/* going in and out: a short fade through the dark */
const ctlPond = document.getElementById('ctlPond'), nameCard = document.getElementById('nameCard');
function enterPond() {
  if (view !== 'garden' || cam !== 0 || pond.dir) return;
  pond.dir = 1; pond.to = 'pond';
}
function leavePond() {
  if (view !== 'pond' || pond.dir) return;
  pond.dir = 1; pond.to = 'garden';
}
function updatePondFade(dt) {
  if (pond.dir === 1) {
    pond.fade = Math.min(1, pond.fade + dt / (RM ? .2 : .45));
    if (pond.fade === 1) {
      if (pond.to === 'pond') {
        view = 'pond'; ctlGarden.inert = true; ctlPond.inert = false;
        pellets = []; hearts = []; lure = null; zs = [];
        nameOpen = false; nameDismissed = false; nameSig = '';
        if (!ax.placed) { ax.x = cols * .5; ax.y = rows * .62; ax.placed = true; }
        ax.retarget = 0;
      } else {
        view = 'garden'; ctlPond.inert = true; ctlGarden.inert = false; nameCard.hidden = true;
      }
      updateCursor();
      pond.dir = -1;
    }
  } else if (pond.dir === -1) {
    pond.fade = Math.max(0, pond.fade - dt / (RM ? .2 : .45));
    if (pond.fade === 0) pond.dir = 0;
  }
}
document.getElementById('pondBack').addEventListener('click', leavePond);

/* going in or out, a rush of bubbles rises over everything and then floats away */
function drawBubbleCurtain() {
  const k = pond.fade;
  if (k <= 0) return;
  setPlane(0, 0);
  const cover = k * (RM ? .3 : .5);
  for (let c = 0; c < cols; c++) {
    const scroll = T * (RM ? 3 : 9) * (.7 + hash(c, 5) * .8);   // each column rises at its own pace
    for (let r = 0; r < rows; r++) {
      const cell = Math.floor(r + scroll), h = hash(c * 3 + 1, cell);
      if (h > cover) continue;
      const ch = h < cover * .15 ? 'O' : h < cover * .55 ? 'o' : '.';
      put(c, r, ch, rgbs(mixc(BG, [150, 180, 220], .35 + .4 * k)));
    }
  }
}

/* underwater */
const surfaceRow = () => Math.max(3, Math.round(rows * .2));
const waterBox = () => ({ x0: 5, x1: cols - 6, y0: surfaceRow() + 2, y1: rows - 4 });
function updatePond(dt) {
  pond.t += dt;
  const here = !!unlockKey, wb = waterBox(), sleeping = here && sleepyHour() && ax.wake <= 0 && !music.playing;
  ax.happy = Math.max(0, ax.happy - dt); ax.wake = Math.max(0, ax.wake - dt);
  ax.blink = ax.blink > 0 ? ax.blink - dt : Math.random() < dt * .3 ? .15 : 0;
  if (here) {
    const fed = petLatest('feed'), peckish = !fed || Date.now() - fed.at > 12 * 36e5;
    // where she wants to be
    let tx = ax.tx, ty = ax.ty, speed = 6;
    const food = pellets.filter(p => !p.eaten).sort((a, b) => Math.abs(a.x - ax.x) - Math.abs(b.x - ax.x))[0];
    if (sleeping) { tx = cols * .5; ty = wb.y1; speed = 1.5; }
    else if (food) { tx = food.x; ty = food.y; speed = 9; }
    else if (lure) { tx = lure.x; ty = lure.y; speed = 10; }
    else {
      ax.retarget -= dt;
      if (ax.retarget <= 0) {
        ax.tx = rand(wb.x0, wb.x1);
        ax.ty = peckish ? rand(wb.y0, wb.y0 + 3) : rand(wb.y0 + 2, wb.y1);   // peckish: up near the surface
        ax.retarget = rand(3, 7);
      }
      tx = ax.tx; ty = ax.ty; speed = 4;
    }
    if (RM) speed *= .6;
    const dx = tx - ax.x, dy = ty - ax.y;
    ax.x += clamp(dx, -speed * dt, speed * dt);
    ax.y += clamp(dy, -speed * .45 * dt, speed * .45 * dt);
    if (Math.abs(dx) > .4) ax.dir = dx > 0 ? 1 : -1;
    // eating, and catching the light
    for (const p of pellets) if (!p.eaten && Math.abs(p.x - ax.x - ax.dir * 2) < 2 && Math.abs(p.y - ax.y) < 1) { p.eaten = true; ax.happy = 1.5; chime(88); }
    if (lure && Math.abs(lure.x - ax.x - ax.dir * 2) < 2 && Math.abs(lure.y - ax.y) < 1.1) {
      lureHits++; ax.happy = 1.2;
      if (lureHits >= 4) { lure = null; ax.happy = 3; hearts.push({ x: ax.x, y: ax.y - 2, born: pond.t }); recordPet('play'); }
      else lure = { x: rand(wb.x0, wb.x1), y: rand(wb.y0, wb.y1) };
    }
    if (sleeping && Math.random() < dt * .7) zs.push({ x: ax.x + ax.dir * 3, y: ax.y - 1, born: pond.t });
    if (Math.random() < dt * (peckish ? .8 : .3)) bubbles.push({ x: ax.x + ax.dir * 3, y: ax.y - 1, vy: rand(1.5, 3) });
  }
  if (Math.random() < dt * .4) bubbles.push({ x: rand(2, cols - 2), y: rows - 2, vy: rand(1, 2.5) });
  for (const b of bubbles) { b.y -= b.vy * dt; b.x += Math.sin(pond.t * 2 + b.vy * 9) * dt * .5; }
  bubbles = bubbles.filter(b => b.y > surfaceRow() + .5);
  for (const p of pellets) if (!p.eaten) { if (p.y < wb.y1 + 1) p.y += 1.4 * dt; else p.rest += dt; }
  pellets = pellets.filter(p => !p.eaten && p.rest < 25);
  hearts = hearts.filter(h => pond.t - h.born < 2.5);
  zs = zs.filter(z => pond.t - z.born < 3);
}

function drawPondScene() {
  const S = surfaceRow(), asp = cw / chH;
  // above the water: a strip of night sky
  for (let r = 0; r < S; r++) for (let c = 0; c < cols; c++)
    if (hash(c + 3, r + 17) < .025) put(c, r, hash(c, r) < .2 ? '+' : '.', rgbs(mixc(BG, STAR, .15 + .2 * Math.sin(T * (.5 + hash(c, r)) + c))));
  // the surface, and the moon broken up in it
  for (let c = 0; c < cols; c++) {
    const v = vnoise(c * .3 + pond.t * .5, 3);
    put(c, S, v > .5 ? '~' : '-', rgbs(mixc(BG, WATER, .35 + .25 * v)));
  }
  for (let k = 0; k < 4; k++) {
    const mc = cols * .74 + Math.sin(pond.t * 1.4 + k) * (1 + k * .6);
    put(mc, S + 1 + k, k % 2 ? '-' : '=', rgbs(mixc(BG, MOON, .22 - k * .04)));
  }
  // lily pads resting on top, one with a flower
  for (const [fx, flower] of [[.18, false], [.5, true], [.86, false]]) {
    const c = Math.round(cols * fx);
    for (let i = 0; i < 4; i++) put(c + i, S, '(__)'[i], rgbs(mixc(BG, [76, 118, 74], .75)));
    if (flower) put(c + 1, S - 1, '*', rgbs(mixc(BG, PET_FRILL, .8)));
  }
  // drifting motes in the water
  for (let r = S + 1; r < rows - 2; r++) for (let c = 0; c < cols; c++)
    if (hash(c + 71, r + 13) < .012) putE(c + Math.sin(pond.t * .3 + r) * .8, r, '.', rgbs(mixc(BG, WATER, .22)));
  // reeds rising from the bottom, swaying
  for (let c = 2; c < cols - 2; c++) {
    if (hash(c, 919) > .14) continue;
    const h = 3 + Math.floor(hash(c, 920) * Math.min(9, rows * .25));
    for (let k = 0; k < h; k++) {
      const sway = Math.sin(pond.t * .8 + c * .7) * (k / h) * 1.4;
      put(c + sway, rows - 3 - k, sway > .5 ? ')' : sway < -.5 ? '(' : '|', rgbs(mixc(BG, REED, .45 + .25 * (k / h))));
    }
  }
  // the bottom: pebbles and silt
  for (let c = 0; c < cols; c++) {
    put(c, rows - 1, hash(c, 31) < .6 ? '_' : '.', rgbs(mixc(BG, [84, 74, 70], .45)));
    if (hash(c, 37) < .18) put(c, rows - 2, 'oO.'[(hash(c, 41) * 3) | 0], rgbs(mixc(BG, [110, 104, 100], .45)));
  }
  for (const b of bubbles) put(b.x, b.y, b.y < S + 3 ? '.' : 'o', rgbs(mixc(BG, [150, 180, 220], .4)));
  for (const p of pellets) put(p.x, p.y, 'o', rgbs(mixc(BG, GOLD, .85 * Math.min(1, 1 - p.rest / 25))));
  if (lure) {
    const g = .6 + .4 * Math.sin(pond.t * 5);
    put(lure.x, lure.y, '*', rgbs(mixc(BG, GOLD, g)));
    sparkle(lure.x, lure.y, (pond.t * .7) % 1.4, GOLD, asp);
  }
  if (unlockKey) drawAxolotl();
  for (const z of zs) { const a = pond.t - z.born; put(z.x + Math.sin(a * 2), z.y - a * .8, 'z', rgbs(mixc(BG, MEM, .5 * (1 - a / 3)))); }
  for (const h of hearts) { const a = pond.t - h.born, c = rgbs(mixc(BG, TERI, .9 * (1 - a / 2.5))); put(h.x, h.y - a * 1.2, '<', c); put(h.x + 1, h.y - a * 1.2, '3', c); }
  // what happened last, softly at the top
  const line = unlockKey ? petLine() : '';
  for (let i = 0; i < line.length; i++) if (line[i] !== ' ') put(cols / 2 - line.length / 2 + i, 1, line[i], rgbs(mixc(BG, MEM, .38)));
}

// facing right: tail on the left, frilly gills above the head, two little legs below
function drawAxolotl() {
  const sleeping = sleepyHour() && ax.wake <= 0 && !music.playing, dance = music.playing && !sleeping;
  const bob = dance ? Math.sin(pond.t * 7) * .6 : Math.sin(pond.t * 1.3) * .2;
  const x = Math.round(ax.x), y = Math.round(ax.y + bob), d = ax.dir;
  const eye = sleeping || ax.blink > 0 ? '-' : (ax.happy > 0 || dance ? '^' : 'o');
  const head = `(${eye}${ax.happy > 0 || dance ? 'w' : '.'}${eye})`;
  const tails = ['~~~', '-~~', '~-~', '~~-'], tf = tails[Math.floor(pond.t * (dance ? 10 : sleeping ? 1 : 4)) % 4];
  const tail = d > 0 ? tf : [...tf].reverse().join('');
  const body = rgbs(PET_BODY), frill = rgbs(PET_FRILL);
  for (let i = 0; i < 5; i++) put(x - 2 + i, y, head[i], body);
  for (let i = 0; i < 3; i++) put(d > 0 ? x - 5 + i : x + 3 + i, y, tail[i], body);
  const gill = Math.sin(pond.t * (dance ? 8 : 3)) > 0 ? '\\|/' : '\\:/';
  for (let i = 0; i < 3; i++) put(x - 1 + i, y - 1, gill[i], frill);
  put(x - 2, y + 1, '"', body); put(x + 1, y + 1, '"', body);
}

function pondTap(cx, cy) {
  const wb = waterBox();
  if (!unlockKey) { bubbles.push({ x: cx, y: Math.max(cy, surfaceRow() + 1), vy: 2 }); return; }
  ax.wake = 120;   // anything you do wakes her for a little while
  if (Math.abs(cx - ax.x) < 4 && Math.abs(cy - ax.y) < 1.8) {
    ax.happy = 2.5;
    hearts.push({ x: ax.x, y: ax.y - 2, born: pond.t });
    recordPet('pet');
    return;
  }
  if (lure) { lure = { x: clamp(cx, wb.x0, wb.x1), y: clamp(cy, wb.y0, wb.y1) }; return; }
  bubbles.push({ x: cx, y: Math.max(cy, surfaceRow() + 1), vy: 2 });
}
document.getElementById('petFeed').addEventListener('click', () => {
  ax.wake = 120;
  const S = surfaceRow();
  for (let i = 0; i < 5; i++) pellets.push({ x: clamp(ax.x + rand(-10, 10), 4, cols - 5), y: S + 1 - i * .6, rest: 0 });
  recordPet('feed');
});
document.getElementById('petPlay').addEventListener('click', () => {
  ax.wake = 120;
  const wb = waterBox();
  lure = lure ? null : { x: rand(wb.x0, wb.x1), y: rand(wb.y0, wb.y1) };
  lureHits = 0;
});
nameCard.addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('petName'), name = input.value.trim().slice(0, 16);
  if (!name) return;
  input.value = '';
  await offerName(name);
  nameSig = ''; renderNameCard();
});
document.getElementById('nameDecide').addEventListener('click', async () => { await decideName(); nameSig = ''; });
document.getElementById('nameClose').addEventListener('click', () => { nameOpen = false; nameDismissed = true; });
document.getElementById('petNameBtn').addEventListener('click', () => { nameOpen = !nameOpen; nameDismissed = !nameOpen; nameSig = ''; });
function syncPond() {
  const inPond = view === 'pond' && !pond.dir, here = !!unlockKey && starsReady;
  // opens by itself while she has no name, or while either of you is in the middle of renaming her
  const round = here ? namingRound() : { offers: [] };
  const wanted = !petName() || round.offers.length > 0;
  const show = inPond && here && (nameOpen || (wanted && !nameDismissed));
  if (nameCard.hidden === show) { nameCard.hidden = !show; nameSig = ''; }
  if (show) renderNameCard();
  for (const id of ['petFeed', 'petPlay', 'petNameBtn']) { const b = document.getElementById(id); if (b.hidden === here) b.hidden = !here; }
  const label = petName() ? 'Rename' : 'Name her';
  const nb = document.getElementById('petNameBtn');
  if (nb.textContent !== label) nb.textContent = label;
  // Play turns into Stop playing while the little light is out, and back again when the game ends
  const pb = document.getElementById('petPlay'), playing = !!lure;
  if (pb.textContent !== (playing ? 'Stop playing' : 'Play')) { pb.textContent = playing ? 'Stop playing' : 'Play'; pb.setAttribute('aria-pressed', String(playing)); }
}

/* ---------- input ---------- */
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { toastEl.hidden = true; }, 2000);
}
function local(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function overStone(p) {
  if (!stoneRect || cam !== 0) return false;
  const c = (p.x - ox) / cw, r = (p.y - oy) / chH;
  return c >= stoneRect.c0 && c < stoneRect.c1 && r >= stoneRect.r0 && r < stoneRect.r1 + 1;
}
stage.addEventListener('pointermove', e => {
  if (view !== 'garden' || camP < 1) return;
  const p = local(e);
  if (pointer.lastX !== null) gust = clamp(gust + (p.x - pointer.lastX) * (e.buttons ? .02 : .01), -6, 6);
  pointer.lastX = p.x; pointer.x = p.x; pointer.y = p.y; pointer.in = true;
  const h = overStone(p), hb = overBox(p) || overVisitor(p), hp = overPond(p);
  if (h !== stoneHover || hb !== boxHover || hp !== pondHover) { stoneHover = h; boxHover = hb; pondHover = hp; updateCursor(); }
});
// a sideways swipe while zoomed in moves to the neighbouring constellation
let swipe = null;
// letting go of the tombstone: a quick tap goes up to the sky, a hold already showed the days
function releaseStone(go) {
  if (!stonePress) return;
  clearTimeout(stonePress.timer);
  const tapped = !stonePress.fired;
  stonePress = null;
  if (tapped && go) goSky();
}
addEventListener('pointercancel', () => releaseStone(false));
stage.addEventListener('pointerup', e => {
  releaseStone(true);
  if (!swipe || view !== 'sky') { swipe = null; return; }
  const p = local(e), dx = p.x - swipe.x, dy = p.y - swipe.y;
  if (zoom.id && zoom.p === 1 && Math.abs(dx) > 60 && Math.abs(dy) < 50 && performance.now() - swipe.t < 700) stepZoom(dx < 0 ? 1 : -1);
  swipe = null;
});
stage.addEventListener('pointerleave', () => { pointer.in = false; pointer.lastX = null; if (stoneHover || boxHover) { stoneHover = boxHover = false; updateCursor(); } });
stage.addEventListener('pointerdown', e => {
  if (e.target !== cv || camP < 1) return;
  const p = local(e);
  const cx = (p.x - ox) / cw, cy = (p.y - oy) / chH;

  if (view === 'sky') {
    if (!starForm.hidden) return;   // don't lose a half-written star to a stray tap
    swipe = { x: p.x, y: p.y, t: performance.now() };
    stopReading(); closeCard();
    return;
  }
  if (view === 'pond') { if (!pond.dir && nameCard.hidden) pondTap(cx, cy); return; }
  if (pond.dir) return;

  pointer.x = p.x; pointer.y = p.y; pointer.lastX = p.x; pointer.in = e.pointerType === 'mouse';
  const asp = cw / chH;
  for (let i = flowers.length - 1; i >= 0; i--) {
    const f = flowers[i];
    if (f.R > 1 && f.P && f.P.w === 0 && Math.hypot((cx - f.cx) * asp, (cy - f.cy) / f.S.tilt) < f.R * 1.05) { scatter(f); return; }
  }
  if (overVisitor(p)) { greetVisitor(); return; }
  if (overBox(p)) { music.playing ? stopMusic() : playMusic(); return; }
  if (overStone(p)) {
    // a tap goes up to the sky; holding shows the days together instead
    clearTimeout(stonePress?.timer);
    stonePress = { fired: false, timer: setTimeout(() => { if (stonePress) { stonePress.fired = true; stoneHold = T; } }, 450) };
    return;
  }
  if (overPond(p)) { enterPond(); return; }
  plant(clamp(cx / cols, .02, .98), chosen, { depth: 1 });
});

const chipBtns = [...document.querySelectorAll('#chips button')];
function choose(sp) { chosen = sp; chipBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sp === sp))); }
chipBtns.forEach(b => b.addEventListener('click', () => choose(b.dataset.sp)));

function doGust() {
  gust = clamp(gust + (Math.random() < .5 ? -1 : 1) * 5, -7, 7);
  for (const f of flowers) if (f.P && f.P.b > .5 && f.P.w === 0) burst(f, 4);
}
function scatterAll() { for (const f of flowers) if (f.age < f.life) { if (f.R > 1) scatter(f); else f.life = f.age; } }
const autoBtn = document.getElementById('auto');
function toggleAuto() { auto = !auto; autoBtn.setAttribute('aria-pressed', String(auto)); toast(auto ? 'Self-seeding on' : 'Self-seeding off'); }

function frameText() {
  const out = [];
  for (let r = 0; r < rows; r++) {
    let s = '';
    for (let c = 0; c < cols; c++) s += gch[r * cols + c] || ' ';
    out.push(s.replace(/\s+$/, ''));
  }
  while (out.length && !out[0]) out.shift();
  return out.join('\n');
}
function copyFrame() {
  const txt = frameText();
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    toast(ok ? 'Frame copied as plain text' : 'This browser blocked copying');
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(() => toast('Frame copied as plain text'), fallback);
  else fallback();
}

document.getElementById('gust').addEventListener('click', doGust);
document.getElementById('scatter').addEventListener('click', scatterAll);
autoBtn.addEventListener('click', toggleAuto);
document.getElementById('copy').addEventListener('click', copyFrame);
downBtn.addEventListener('click', () => zoom.id ? zoomOut() : goGarden());
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.target === codeInput || e.target.closest?.('#starForm, #nameCard')) { if (k === 'escape') e.target.blur(); return; }
  // typing a digit at the lock goes into the code even if the box lost focus
  if (view === 'sky' && lock.state === 'locked' && !codeInput.hidden && /^[0-9]$/.test(k)) { codeInput.focus({ preventScroll: true }); return; }
  if (k === 'escape') {
    if (view === 'pond') { if (!nameCard.hidden) nameCard.hidden = true; leavePond(); return; }
    if (reading.on) stopReading();
    else if (!starForm.hidden) closeStarForm();
    else if (!card.hidden) closeCard(true);
    else if (zoom.id) zoomOut();
    else goGarden();
    return;
  }
  if (view === 'sky') {
    if (k === 'c') copyFrame();
    else if (k === 'arrowright') stepSky(1);
    else if (k === 'arrowleft') stepSky(-1);
    return;
  }
  if (k >= '1' && k <= '5') choose(['random', ...KEYS][+k - 1]);
  else if (k === ' ') { e.preventDefault(); doGust(); }
  else if (k === 's') scatterAll();
  else if (k === 'a') toggleAuto();
  else if (k === 'c') copyFrame();
});
addEventListener('hashchange', () => { if (location.hash === '#sky') goSky(); });

new ResizeObserver(resize).observe(stage);
resize();
if (document.fonts) document.fonts.load(`14px "IBM Plex Mono"`).then(resize, () => {});
if (location.hash === '#sky') goSky(true);
restoreUnlock();
connect();
// keep a copy on the device so the garden opens offline (only where browsers allow it: https and localhost)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
</body>
